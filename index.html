<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Entry Pass Scanner</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  </head>
  <body>
    <h1>Entry Pass Scanner</h1>
    <p class="sub">Point the camera at the guest's QR code v2</p>

    <div id="reader"></div>

    <div id="cameraControls" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;margin:10px 0;">
      <button id="torchBtn" style="display:none;padding:8px 14px;border-radius:8px;border:1px solid #999;background:#fff;cursor:pointer;">🔦 Torch</button>
      <div id="zoomWrap" style="display:none;align-items:center;gap:8px;">
        <label for="zoomSlider" style="font-size:13px;">Zoom</label>
        <input type="range" id="zoomSlider" min="1" max="5" step="0.1" value="1" />
      </div>
    </div>

    <div class="card" id="resultCard">
      <h2>Scanned Details</h2>

      <div class="field">
        <label>Raw QR Data</label>
        <div class="raw-box" id="rawData"></div>
      </div>

      <div class="field">
        <label>Guest Name</label>
        <input type="text" id="nameField" placeholder="Auto-filled from QR" />
      </div>

      <div class="field">
        <label>Table No</label>
        <input type="text" id="tableField" placeholder="Auto-filled from QR" />
      </div>

      <div class="field">
        <label>Number of Participants</label>
        <input
          type="text"
          id="participantsField"
          placeholder="Auto-filled from QR"
        />
      </div>

      <div class="field">
        <label>Code</label>
        <input type="text" id="codeField" placeholder="Auto-filled from QR" />
      </div>

      <div class="field">
        <label>Notes</label>
        <textarea id="notesField" rows="2" placeholder="Optional"></textarea>
      </div>

      <button id="submitBtn">Submit to Sheet</button>
      <button id="rescanBtn">Scan Another</button>

      <div id="status"></div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
